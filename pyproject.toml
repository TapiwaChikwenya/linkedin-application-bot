[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linkedin-easy-apply-assistant"
version = "1.0.0"
description = "Configurable browser assistant for reviewing and completing LinkedIn Easy Apply forms."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE.md"}
authors = [{name = "Project Maintainers"}]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "selenium>=4.18,<5",
  "webdriver-manager>=4,<5",
  "python-dotenv>=1,<2",
  "fastapi>=0.115,<1",
  "python-multipart>=0.0.9,<1",
  "uvicorn>=0.30,<1",
  "jinja2>=3.1,<4",
  "pypdf>=5,<6",
]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8", "ruff>=0.5", "httpx>=0.27,<1"]

[project.scripts]
linkedin-easy-apply = "linkedin_easy_apply.cli:main"

[tool.setuptools]
package-dir = {linkedin_easy_apply = "src/linkedin_easy_apply"}
packages = ["linkedin_easy_apply", "linkedin_easy_apply.dashboard"]
py-modules = ["linkedin", "config", "constants", "utils"]

[tool.setuptools.package-data]
linkedin_easy_apply = ["dashboard/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["linkedin2.py", "Linkedin3.py", "globalLogic.py", "Docker"]
